name: Deploy PPR App to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies & Build Frontend
        run: |
          npm ci --legacy-peer-deps
          npm run build

      - name: Deploy Files to VPS via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "dist/*,server.ts,package.json,package-lock.json,tsconfig.json"
          target: "/var/www/horemow.com/ppr"
          overwrite: true
          tar_tmp_path: "/tmp"

      - name: Install Server Dependencies & Restart PM2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            export PATH=$PATH:/usr/bin:/usr/local/bin:/home/ubuntu/.npm-global/bin
            cd /var/www/horemow.com/ppr
            npm ci --legacy-peer-deps
            pm2 startOrRestart ecosystem.config.js --update-env
            pm2 save
